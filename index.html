<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChessMaster — play chess online, train with puzzles, and analyze your games. Improve your game, one move at a time." />
    <title>ChessMaster — Play Chess. Improve Your Game.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        var stored = null;
        try { stored = window.localStorage.getItem("cm-theme"); } catch (e) {}
        applyThemeToDOM(stored === "light" || stored === "dark" ? stored : "dark");
        if (window.self !== window.top) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              var theme = event.data.theme;
              if (theme === "light" || theme === "dark") applyThemeToDOM(theme);
            }
          });
        }
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: String(event.filename || "").slice(0, 200),
                  lineno: event.lineno,
                  colno: event.colno,
                  stack: event.error && event.error.stack
                    ? String(event.error.stack).slice(0, 2000)
                    : ""
                }
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
